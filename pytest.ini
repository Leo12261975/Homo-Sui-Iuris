[pytest]
# The relay/transport tests are asyncio-based. `auto` mode runs any
# `async def test_*` on an event loop, so the existing @pytest.mark.asyncio
# markers keep working and future async tests need no marker at all.
asyncio_mode = auto

# Fresh event loop per test function — the network tests bind real
# loopback sockets and must not share loop state across tests.
asyncio_default_fixture_loop_scope = function

testpaths = .
python_files = test_*.py

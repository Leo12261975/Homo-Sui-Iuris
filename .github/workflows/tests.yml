name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Just the ends of the supported range: the declared 3.10 floor
        # (code uses `str | Path` runtime annotations) and the newest.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v5

      # uv supplies the Python and installs deps (fast, cached) — no separate
      # setup-python step needed.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run test suite
        # --locked fails if uv.lock is stale (deps changed without relocking);
        # -ra summarises any non-passes. The Docker dry run is opt-in
        # (HSI_RUN_DOCKER_TESTS) and skipped here — it has its own job below.
        run: uv run --locked --python ${{ matrix.python-version }} pytest -ra

  # Faithful end-to-end reproduction of DRY_RUN_2026_07_18: real relay + 3 node
  # containers + verifier, asserting antigen fan-out to N>1 recipients. Separate
  # from the fast pytest matrix because it builds an image and takes ~1–2 min.
  docker-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Multi-node dry run (docker compose)
        # The AI threat judge stays off in CI (no model endpoint) — the
        # heuristic path and fan-out are what this job proves.
        run: bash tests/dryrun/run_dry_run_test.sh

      - name: Reconnect across relay restart (docker compose)
        run: bash tests/dryrun/run_reconnect_test.sh

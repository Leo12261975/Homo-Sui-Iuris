[project]
name = "homo-sui-iuris"
version = "0.1.0"
description = "Free Cognitive Protocol (FCP): cognitive digital immunity and individual sovereignty."
requires-python = ">=3.10"   # code uses `str | Path` runtime annotations (3.10+)
dependencies = [
    # Only runtime dep; everything else is stdlib. Bounded to the tested 16.x:
    # the code uses the legacy top-level API (websockets.serve/connect,
    # WebSocketServerProtocol, websockets.http11) that a future major may drop.
    # uv.lock pins the exact patch (16.1.1) for reproducible installs.
    "websockets>=16,<17",
]

# PEP 735 dev group — installed by `uv sync` by default, skipped by
# `uv sync --no-dev` (e.g. for the runtime container).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",  # the relay/transport tests are async
]

# A loose collection of scripts, not an installable library — so uv should
# manage the environment without trying to build/install this project.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Async relay tests are asyncio-based; `auto` runs any `async def test_*`
# without a per-test marker. Fresh event loop per test (they bind real
# loopback sockets).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
python_files = ["test_*.py"]
